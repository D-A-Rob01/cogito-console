[project]
name = "auratrack"
version = "0.1.0"
description = "Introspective orchestration and synaptic steering framework demo."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.138.0",
  "uvicorn[standard]>=0.49.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.0",
  "websockets>=16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
