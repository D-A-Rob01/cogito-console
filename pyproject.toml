[project]
name = "cogito-console"
version = "0.3.0"
description = "Cogito Console: auditable local AI steering and inference-event visualization."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.138.0",
  "uvicorn[standard]>=0.49.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.0",
  "websockets>=16.0",
]

local = [
  "psutil>=6.1.0",
  "torch>=2.6.0",
  "transformers>=4.48.0,<6",
]

[project.scripts]
cogito-purge = "cogito_console.purge:main"

[tool.setuptools.packages.find]
include = ["cogito_console"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
